[package]
name = "zero2prod"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
authors = ["Shubhendu Anupam Dutta <shubhenduanupam@gmail.com>"]
repository = "https://github.com/shubhenduanupamdutta/Zero2Prod"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "zero2prod"
path = "src/main.rs"

[dependencies]
actix-session = { version = "0.11.0", features = ["redis-session-rustls"] }
actix-web = "4.12.1"
actix-web-flash-messages = { version = "0.5.0", features = ["cookies"] }
anyhow = "1.0.102"
argon2 = { version = "0.5.3", features = ["std"] }
base64 = "0.22.1"
chrono = { version = "0.4.43", default-features = false, features = [
  "clock",
  "serde",
] }
config = "0.15.19"
htmlescape = "0.3.1"
rand = { version = "^0.9.0", features = ["std_rng"] }
reqwest = { version = "0.13.2", features = ["cookies", "form", "json", "rustls"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-aux = "4.7.0"
sha3 = "0.10.8"
sqlx = { version = "0.8.6", features = [
  "chrono",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio-rustls",
  "uuid",
] }
tera = { version = "1.20.1", default-features = false }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-actix-web = "0.7.21"
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.22", features = [
  "env-filter",
  "registry",
] }
unicode-segmentation = "1.12.0"
urlencoding = "2.1.3"
uuid = { version = "1.21.0", features = ["serde", "v4"] }
validator = "0.20.0"

[dev-dependencies]
claims = "0.8.0"
fake = "4.4.0"
linkify = "0.10.0"
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
serde_json = "1.0.149"
wiremock = "0.6.5"
